# Caelestia user template for kitty. The `caelestia` CLI fills in the
# `{{ name.hex }}` tokens from the active scheme and writes the result to
# ~/.local/state/caelestia/theme/kitty.conf, which kitty.conf includes.
# Roles match the OSC sequences Caelestia pushes to live terminals, so
# already-open and freshly opened windows end up with the same colours.
background            #{{ surface.hex }}
foreground            #{{ onSurface.hex }}
cursor                #{{ secondary.hex }}
cursor_text_color     #{{ onSecondary.hex }}

selection_background  #{{ secondary.hex }}
selection_foreground  #{{ onSecondary.hex }}
url_color             #{{ primary.hex }}

# Active/inactive window borders (matches the Hyprland border scheme).
active_border_color   #{{ primary.hex }}
inactive_border_color #{{ outlineVariant.hex }}

# Tab bar.
active_tab_background   #{{ primary.hex }}
active_tab_foreground   #{{ onPrimary.hex }}
inactive_tab_background #{{ surfaceContainerHigh.hex }}
inactive_tab_foreground #{{ onSurfaceVariant.hex }}

# Terminal ANSI palette.
color0  #{{ term0.hex }}
color8  #{{ term8.hex }}
color1  #{{ term1.hex }}
color9  #{{ term9.hex }}
color2  #{{ term2.hex }}
color10 #{{ term10.hex }}
color3  #{{ term3.hex }}
color11 #{{ term11.hex }}
color4  #{{ term4.hex }}
color12 #{{ term12.hex }}
color5  #{{ term5.hex }}
color13 #{{ term13.hex }}
color6  #{{ term6.hex }}
color14 #{{ term14.hex }}
color7  #{{ term7.hex }}
color15 #{{ term15.hex }}
